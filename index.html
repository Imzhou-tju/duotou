<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B6CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="多投">
<title>多投 · 秋招投递记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div id="view-auth" class="view auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">多投</div>
    <div class="sub">秋招投递记录 · 云端同步</div>
    <input id="auth-email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="auth-pass" type="password" placeholder="密码（注册需至少 6 位）" autocomplete="current-password">
    <div id="auth-error" class="auth-error"></div>
    <button id="btn-signin" class="btn primary block">登录</button>
    <button id="btn-signup" class="btn ghost block">注册新账号</button>
    <div class="tip">首次使用：填邮箱密码 → 点「注册新账号」；之后直接「登录」</div>
  </div>
</div>

<!-- 主应用 -->
<div id="app-root" class="hidden">
  <header>
    <div class="brand">多投</div>
    <div class="spacer"></div>
    <span id="user-email" class="user-email"></span>
    <button id="btn-signout" class="link-btn">退出</button>
  </header>

  <nav>
    <button class="nav-btn on" data-nav="home">首页</button>
    <button class="nav-btn" data-nav="list">投递</button>
    <button class="nav-btn" data-nav="search">搜索</button>
    <button class="nav-btn add" data-nav="edit">＋ 添加</button>
  </nav>

  <main>
    <!-- 首页 -->
    <section id="view-home" class="view">
      <div class="hero">
        <div class="hero-top"><span id="stat-total" class="hero-num">0</span><span class="hero-label">累计投递</span></div>
        <div class="hero-stats">
          <div class="hs"><span id="stat-active" class="hs-num">0</span><span class="hs-label">进行中</span></div>
          <div class="hs"><span id="stat-offer" class="hs-num">0</span><span class="hs-label">Offer</span></div>
          <div class="hs"><span id="stat-reject" class="hs-num">0</span><span class="hs-label">拒绝</span></div>
        </div>
      </div>
      <div class="sec-title">最近更新</div>
      <div id="home-list" class="list"></div>
    </section>

    <!-- 投递列表 -->
    <section id="view-list" class="view hidden">
      <div id="list-count" class="count"></div>
      <div id="list-box" class="list"></div>
    </section>

    <!-- 搜索 -->
    <section id="view-search" class="view hidden">
      <div class="search-bar"><input id="search-kw" placeholder="搜索单位 / 岗位 / 备注"></div>
      <div class="card">
        <div class="f-row"><span class="f-label">阶段</span><div id="search-stages" class="chips"></div></div>
        <div class="f-row"><span class="f-label">Base</span><input id="search-base" class="f-input" placeholder="如 北京"></div>
        <div class="f-row"><span class="f-label">排序</span>
          <div class="sort-toggle">
            <button class="sort-opt on" data-sort="update_desc">最近更新</button>
            <button class="sort-opt" data-sort="apply_desc">投递日期 ↓</button>
            <button class="sort-opt" data-sort="apply_asc">投递日期 ↑</button>
          </div>
        </div>
      </div>
      <div id="search-count" class="count"></div>
      <div id="search-list" class="list"></div>
    </section>

    <!-- 添加 / 编辑 -->
    <section id="view-edit" class="view hidden">
      <div class="sec-title" id="edit-title">添加投递</div>
      <div class="card">
        <div class="form-row"><span class="f-label req">单位名称</span><input id="f-company" placeholder="如 字节跳动"></div>
        <div class="form-row"><span class="f-label">Base 地</span><input id="f-base" placeholder="如 北京"></div>
        <div class="form-row"><span class="f-label">二级单位</span><input id="f-sub" placeholder="选填，如 抖音"></div>
        <div class="form-row"><span class="f-label">岗位名称</span><input id="f-position" placeholder="如 后端开发"></div>
        <div class="f-row"><span class="f-label">投递链接</span><input id="f-link" class="f-input" placeholder="选填"></div>
        <div class="f-row col"><span class="f-label">备注</span><textarea id="f-remark" rows="3" placeholder="选填"></textarea></div>
      </div>
      <div class="sec-title">当前阶段</div>
      <div class="card"><div id="edit-stages" class="chips"></div></div>
      <div class="sec-title">各阶段日期 <span class="tip-inline">支持输入：今天 / 昨天 / 3天前 / 9月28日 / 2026-09-28</span></div>
      <div class="card"><div id="edit-dates"></div></div>
      <div class="actions">
        <button id="btn-cancel" class="btn ghost">取消</button>
        <button id="btn-save" class="btn primary">保存</button>
        <button id="btn-delete" class="btn danger hidden">删除</button>
      </div>
    </section>

    <!-- 详情 -->
    <section id="view-detail" class="view hidden">
      <div id="detail-box"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
