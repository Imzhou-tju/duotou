<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B6CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="多投">
<title>多投 · 秋招投递记录</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div id="view-auth" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo">多投</div>
    <div class="sub">秋招投递记录 · 云端同步</div>
    <input id="auth-email" type="email" placeholder="邮箱" autocomplete="email">
    <input id="auth-pass" type="password" placeholder="密码（注册需至少 6 位）" autocomplete="current-password">
    <div id="auth-error" class="auth-error"></div>
    <button id="btn-signin" class="btn primary block">登录</button>
    <button id="btn-signup" class="btn ghost block">注册新账号</button>
    <div class="tip">首次使用：填邮箱密码 → 点「注册新账号」；之后直接「登录」</div>
  </div>
</div>

<!-- 主应用 -->
<div id="app-root" class="hidden">
  <header class="topbar">
    <div class="brand">多投</div>
    <div class="spacer"></div>
    <span id="user-email" class="user-email"></span>
  </header>

  <main>
    <!-- 投递动态（合并首页 + 列表） -->
    <section id="view-feed" class="view">
      <div class="hero">
        <div class="hero-stats">
          <div class="hs"><span id="stat-active" class="hs-num">0</span><span class="hs-label">进行中</span></div>
          <div class="hs"><span id="stat-offer" class="hs-num">0</span><span class="hs-label">Offer</span></div>
          <div class="hs"><span id="stat-reject" class="hs-num">0</span><span class="hs-label">未过</span></div>
          <div class="hs"><span id="stat-total" class="hs-num">0</span><span class="hs-label">总计</span></div>
        </div>
      </div>

      <div id="feed-filters" class="chips filter">
        <span class="chip on" data-filter="all">全部</span>
        <span class="chip" data-filter="active">进行中</span>
        <span class="chip" data-filter="Offer">Offer</span>
        <span class="chip" data-filter="reject">未过</span>
      </div>

      <div id="feed-list" class="list"></div>
    </section>

    <!-- 搜索 -->
    <section id="view-search" class="view hidden">
      <div class="search-bar"><input id="search-kw" placeholder="搜索单位 / 岗位 / 备注"></div>
      <div class="card">
        <div class="f-row"><span class="f-label">阶段</span><div id="search-stages" class="chips"></div></div>
        <div class="f-row"><span class="f-label">Base</span><input id="search-base" class="f-input" placeholder="如 北京"></div>
      </div>
      <div id="search-count" class="count"></div>
      <div id="search-list" class="list"></div>
    </section>

    <!-- 我 -->
    <section id="view-account" class="view hidden">
      <div class="card account-card">
        <div class="avatar" id="account-avatar">周</div>
        <div>
          <div class="acc-email" id="account-email"></div>
          <div class="acc-sub">已开启云端同步</div>
        </div>
      </div>
      <div class="menu">
        <button class="menu-item" id="btn-export">导出 CSV 备份<span class="mi-arrow">›</span></button>
        <button class="menu-item danger" id="btn-signout">退出登录<span class="mi-arrow">›</span></button>
      </div>
      <div class="acc-foot">数据仅本人可见 · Free Plan 不自动备份，建议定期导出</div>
    </section>
  </main>

  <!-- 底部标签栏 -->
  <nav class="tabbar">
    <button class="tab on" data-nav="feed">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 11.5 12 4l8 7.5M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-nav="search">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>搜索</span>
    </button>
    <button class="tab" data-nav="account">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>我</span>
    </button>
  </nav>

  <!-- 悬浮添加按钮 -->
  <button id="fab" class="fab" aria-label="添加投递">+</button>

  <!-- 详情底部弹层 -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <!-- 添加 / 编辑（全屏覆盖层） -->
  <section id="view-edit" class="view edit-overlay hidden">
    <div class="edit-head">
      <button id="btn-cancel" class="link-btn">取消</button>
      <div id="edit-title" class="edit-title">添加投递</div>
      <button id="btn-save" class="link-btn primary">保存</button>
    </div>
      <div class="edit-scroll">
      <div class="card form-card">
        <div class="seg" id="f-mode">
          <button type="button" class="seg-btn on" data-mode="single">单个单位</button>
          <button type="button" class="seg-btn" data-mode="group">集团投递</button>
        </div>
        <div class="form-row" id="row-group" hidden>
          <span class="f-label">集团</span><input id="f-group" list="group-list" placeholder="如 中信银行（同集团分行会自动合并）"><datalist id="group-list"></datalist>
          <div id="group-hint" class="input-hint hidden"></div>
        </div>
        <div class="form-row"><span class="f-label req">单位名称</span><input id="f-company" placeholder="如 字节跳动"></div>
        <div class="form-row"><span class="f-label">Base 地</span><input id="f-base" placeholder="如 成都 / 深圳 / 江西南昌"><div id="f-base-hint" class="input-hint hidden"></div></div>
        <div class="form-row"><span class="f-label">二级单位</span><input id="f-sub" placeholder="选填，如 抖音"></div>
        <div class="form-row"><span class="f-label">岗位名称<button type="button" id="f-pos-batch" class="pos-toggle hidden">批量</button></span><input id="f-position" placeholder="如 后端开发"><textarea id="f-position-multi" rows="3" class="hidden" placeholder="每行一个岗位，其余信息共用"></textarea></div>
        <div class="form-row"><span class="f-label">投递链接</span><input id="f-link" placeholder="选填"></div>
        <div class="form-row col"><span class="f-label">备注</span><textarea id="f-remark" rows="3" placeholder="选填"></textarea></div>
      </div>
      <div class="sec-title">当前阶段</div>
      <div class="card"><div id="edit-stages" class="chips"></div></div>
      <div class="sec-title">各阶段日期</div>
      <div class="card"><div id="edit-dates"></div></div>
      <button id="btn-delete" class="btn danger block hidden">删除这条记录</button>
    </div>
  </section>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
